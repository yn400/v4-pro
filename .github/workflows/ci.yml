name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with Ruff
        run: |
          pip install ruff
          ruff check --output-format=github .

      - name: Test with pytest
        run: |
          python -m pytest -v --tb=short --cov=v4_pro --cov-report=term --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  self-gate:
    # 自门禁: v4-pro 检查 v4-pro 自己 — 质量门禁工具必须先过自己这关
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e .

      - name: Our own source must PASS the gate
        run: v4-pro verify --code ./v4_pro/

      - name: AI-slop demo must FAIL the gate (detectors alive)
        run: |
          if v4-pro verify --code ./examples/; then
            echo "::error::examples/ should have been blocked"; exit 1
          fi
          echo "gate correctly blocked the AI-slop demo"
