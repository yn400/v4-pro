name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with Ruff
        run: |
          pip install ruff
          ruff check --output-format=github .

      - name: Test with pytest
        run: |
          python -m pytest -v --tb=short --cov=v4_pro --cov-report=term --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  self-gate:
    # 自门禁: v4-pro 检查 v4-pro 自己 — 质量门禁工具必须先过自己这关
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deep engines (semgrep + oxlint)
        run: |
          pip install -e .
          pip install semgrep
          npm install -g oxlint

      - name: Our own source must PASS the gate (with deep engines)
        run: |
          v4-pro verify --code ./v4_pro/ --semgrep
          echo "self-gate passed with semgrep + oxlint active"

      - name: AI-slop demo must FAIL the gate (detectors alive)
        run: |
          if v4-pro verify --code ./examples/ --semgrep; then
            echo "::error::examples/ should have been blocked"; exit 1
          fi
          echo "gate correctly blocked the AI-slop demo"

      - name: Semgrep engine actually produced findings (not silently skipped)
        run: |
          v4-pro verify --code ./examples/ --semgrep --format json > gate.json
          python -c "
          import json, sys
          r = json.load(open('gate.json', encoding='utf-8'))
          assert 'semgrep' in r['checks'], 'semgrep check missing — engine did not run'
          n = len(r['checks']['semgrep']['issues'])
          assert n > 0, 'semgrep produced no findings on AI-slop demo'
          print(f'semgrep findings on demo: {n}')
          "
