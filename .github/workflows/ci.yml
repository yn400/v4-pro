name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with Ruff
        run: |
          pip install ruff
          ruff check --output-format=github .

      - name: Test with pytest
        run: |
          python -m pytest -v --tb=short --cov=v4_pro --cov-report=term --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  self-gate:
    # 自门禁: v4-pro 检查 v4-pro 自己 — 质量门禁工具必须先过自己这关
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deep engines (semgrep + oxlint)
        run: |
          pip install -e .
          pip install semgrep
          npm install -g oxlint

      - name: Our own source must PASS the gate (with deep engines)
        run: |
          v4-pro verify --code ./v4_pro/ --semgrep
          echo "self-gate passed with semgrep + oxlint active"

      - name: AI-slop demo must FAIL the gate (detectors alive)
        run: |
          if v4-pro verify --code ./examples/ --semgrep; then
            echo "::error::examples/ should have been blocked"; exit 1
          fi
          echo "gate correctly blocked the AI-slop demo"

      - name: Semgrep engine diagnostics + assertions
        run: |
          semgrep --version
          echo "--- validate bundled rules ---"
          semgrep scan --config v4_pro/semgrep_rules --validate || echo "::warning::rule validation reported issues (see above)"
          echo "--- raw semgrep on examples ---"
          semgrep scan --config v4_pro/semgrep_rules --json --metrics=off examples/ > raw.json || echo "::warning::semgrep exited nonzero"
          python -c "
          import json
          d = json.load(open('raw.json'))
          print('semgrep results:', len(d.get('results', [])))
          print('semgrep errors:', json.dumps(d.get('errors', []))[:1000])
          "
          echo "--- through v4-pro gate ---"
          v4-pro verify --code ./examples/ --semgrep --format json > gate.json || true
          python -c "
          import json
          r = json.load(open('gate.json', encoding='utf-8'))
          sg = r['checks'].get('semgrep')
          assert sg is not None, f'semgrep check missing; have {list(r[chr(99)+chr(104)+chr(101)+chr(99)+chr(107)+chr(115)])}'
          print('engine notes:', sg['summary'].get('notes'))
          n = len(sg['issues'])
          print('gate semgrep findings:', n)
          for i in sg['issues']:
              print('  -', i['rule_id'], i['file'], i['line'])
          assert n > 0, 'semgrep produced no findings - see diagnostics above'
          "
